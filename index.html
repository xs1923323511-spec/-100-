SC.s2={day:"爆发前2小时",text:"你决定再做一些准备……",ch:[{t:"（1）囤积食物",rt:"购买了马铃薯、白菜、方便面、压缩饼干、牛肉和水果。",ef:{s:70},nx:"s3"},{t:"（2）购买药品",rt:"购买了各种药物和维生素，还搞来一针肾上腺素。",ef:{s:40},nx:"s3",cw:{n:"异能",d:"面临死亡时可强行存活一次",s:100},cb:function(){G.ad=1}},{t:"（3）购买武器",rt:"你在黑市买到一把猎枪和大量弹药。拳头才是硬道理。",ef:{a:15},nx:"s3"}]};
SC.s3={day:"末日降临",text:"商场传来惨叫——丧尸正在啃咬路人！末世爆发了！\n\n你急忙开车赶回庇护所。街道乱作一团。你走神时撞到了一只带项圈的狗——它无法行走了。",ch:[{t:"（1）带回救治（-3弹药）",rt:"你救治了狗狗，起名莱姆。它是你在末世中最值得信任的伙伴！",ef:{a:-3,h:10},cp:"莱姆",cb:function(){G.le=1;AW("伙伴","与莱姆在末日中相依为命",100)},nx:"d1"},{t:"（2）无视它",rt:"身处末世，仁慈就是对自己的残忍。",ef:{h:-5},nx:"d1"},{t:"（3）转化为物资",rt:"这不是狗，是储备粮。你结束了它的痛苦。",ef:{s:10,h:-30},nx:"d1",cw:{n:"自私的胆小鬼",d:"将狗转化为物资",s:-100}}]};
SC.d1={day:"惊变第一天",text:"你在庇护所哪也不敢去。看着胳膊上的伤疤久久不能入睡——这是前世划伤的，为什么重生后还在？\n\n面对末世，一个声音告诉你……",ch:[{t:"（1）不择手段，活着最重要",ef:{h:-10},rt:"你坚定了信念：末世之中生存高于一切。",nx:"d2"},{t:"（2）不要丧失人性",ef:{h:10},rt:"你守住了内心的底线。",nx:"d2"},{t:"（3）真相比什么都重要",rt:"你记得前世死在末世爆发一个月整。决定到时去悬崖看个究竟。",nx:"d2",cb:function(){G.h+=5}}]};
SC.d2={day:"惊变第二天",text:"消耗5物资。",ch:[{t:"（1）苟在家里",rt:"庇护所很安全。煮了红烧牛肉面。",ef:{h:5,s:-5},nx:"d3"},{t:"（2）外出探索物资",rt:"在附近找到了一些物资和弹药。",ef:{s:15,a:2},nx:"d3"}]};
SC.d3={day:"惊变第三天",text:"消耗5物资。",ch:[{t:"（1）苟在家里",rt:"煮了老坛酸菜面。",ef:{h:5,s:-5},nx:"d4"},{t:"（2）外出探索物资",rt:"在废墟中找到了一些物资。",ef:{s:15,a:1},nx:"d4"}]};
SC.d4={day:function(){return"惊变第四天"},text:function(){return G.sh==="villa"?"消耗5物资。\n\n你正在煎牛排——房门突然被打开了！\n\n一个满身是伤的男人惊讶地看着你：\"你……你是谁？这是我的房子！\"":"消耗5物资。你看着防空洞天花板开始emo了。"},ch:[{t:function(){return G.sh==="villa"?"（1）开门对质":"（1）苟在家里"},rt:function(){return G.sh==="villa"?"他叫布莱克——别墅原主人。他外出找物资遭遇了丧尸袭击。\n\n\"兄弟，收留我吧。我可以帮守夜，弹药都给你。\"":"你看着天花板emo了。"},ef:function(){return G.sh==="villa"?{h:5}:{h:-5,s:-5}},nx:function(){return G.sh==="villa"?"d4v":"d5"}},{t:"（2）外出探索",rt:"搜到了一些物资。",ef:{s:15,a:2},nx:"d5"},{t:"（3）清理丧尸（-5弹药）",rt:"清理了附近丧尸。在尸体上发现收音机！正播放紧急广播。",ef:{a:-5},nx:"d5",cb:function(){G.rd=1},co:function(){return !G.rd}}]};
SC.d4v={day:"惊变第四天-别墅",text:"布莱克虚弱地道谢。\n\n\"兄弟，收留我吧。我可以帮守夜，我知道这附近哪里能找到物资。弹药我也都给你。\"\n\n他真诚地看着你，等你答复。",ch:[{t:"（1）收留他",rt:"布莱克成了你的伙伴。有他在，安全感提升了。",ef:{a:10,h:10},cp:"布莱克",nx:"d5"},{t:"（2）拒绝",rt:"末世不能轻信任何人。你赶走了他。",ef:{h:-10},nx:"d5",cw:{n:"自私的胆小鬼",d:"拒绝了需要帮助的布莱克",s:-100}}]};
SC.d5={day:"惊变第五天",text:function(){return"消耗5物资。"+(G.sh==="bunker"?"（防空洞今天有特殊发现）":"")},ch:[{t:"（1）苟在家里",rt:"犒劳自己，做了意大利面。",ef:{h:5,s:-5},nx:"d10"},{t:"（2）外出探索物资",rt:function(){return G.sh==="bunker"?"在防空洞附近发现隐藏地下室，有武器和物资！":"找到了一些物资。"},ef:function(){return G.sh==="bunker"?{s:20,a:5}:{s:15,a:2}},nx:"d10"},{t:function(){return"（3）"+(G.sh==="bunker"?"外出（防空洞访客）":"探索未知区域")},nx:function(){return G.sh==="bunker"&&!G.ue.luna?"luna":"exp_d"},sp:true,ex:true,ce:"luna"}]};
SC.d10={day:"惊变第十天",text:"转眼末世已经十天了。全球电力系统瘫痪，天空异常灰暗。\n\n物资消耗+10，消耗15物资。远处传来广播声。",ch:[{t:"（1）苟在家里",rt:"待在庇护所观望。",ef:{h:5,s:-15},nx:"d15"},{t:"（2）外出探索物资",rt:"在废墟中找到罐头和弹药。",ef:{s:20,a:5},nx:"d15"},{t:"（3）收听收音机",rt:"收音机：\"请保护自己！约翰博士正在研究丧尸病毒血清。\"",co:function(){return G.rd},nx:"d15",cb:function(){G.rd=1}},{t:"（4）探索未知区域",nx:"exp_d",sp:true,ex:true}]};
SC.d15={day:"惊变十五天",text:function(){return"消耗15物资。"+(G.sh==="villa"?"（仅今天：别墅有特殊发现）":G.sh==="bunker"?"（仅今天：防空洞有特殊发现）":"")},ch:[{t:function(){return G.sh==="villa"?"（1）检查别墅内部":"（1）打造培育室"},rt:function(){return G.sh==="villa"?(HP("布莱克")?"你仔细检查别墅，在某个衣柜发现暗格——霰弹枪和压缩饼干！布莱克有些尴尬地看着你。":"你仔细检查别墅，在衣柜暗格发现了霰弹枪和压缩饼干。"):(HP("露娜")?"你打造了菌类培育室。露娜帮了大忙。":"你打造了菌类培育室，种下快速生长的菌类。")},ef:function(){return G.sh==="villa"?{a:10,s:30}:{s:40,h:5}},nx:"d20"},{t:"（2）外出探索物资",rt:"进行了一次区域探索。",ef:{s:20,a:3},cb:function(){G.ex++},nx:"d20"},{t:"（3）探索未知区域",nx:"exp_d",sp:true,ex:true},{t:"（4）营地",nx:"camp",ex:true}]};
SC.d20={day:"惊变二十天",text:"根据前世记忆，郊外有个黎明者营地可以交易物资。\n消耗15物资。",ch:[{t:"（1）苟在家里",rt:"看着天花板开始emo。",ef:{h:-5,s:-15},nx:"d25"},{t:"（2）外出探索物资",rt:"搜集了一些物资。",ef:{s:20,a:3},cb:function(){G.ex++},nx:"d25"},{t:"（3）黎明者营地",co:function(){return !G.blk},eh:function(){return G.blk?"(已拉黑)":""},rt:"天台上的幸存者市场，可交易物资。",nx:"camp",sp:true,ex:true},{t:"（4）探索未知区域",nx:"exp_d",sp:true,ex:true}]};

SC.d30={day:"惊变第三十天",text:"消耗15物资。外出时听到远处传来求救声——一个年轻女性被丧尸围困在车后。",ch:[{t:"（1）开枪救她（-3弹药）",rt:"精准击毙丧尸。\"我叫伊芙琳，谢谢你。\"",ef:{a:-3,h:10},nx:"d30e"},{t:"（2）用铁管冲上去",rt:"与丧尸搏斗救下她。\"你够勇的。\"",ef:{h:15,s:-5},nx:"d30e"},{t:"（3）绕道离开",rt:"转身离开，但内心不安。",ef:{h:-10},nx:"d35"}]};
SC.d30e={day:"惊变第三十天",text:"\"我叫伊芙琳。\"她伸出手。\"我知道附近有个超市，一起去吗？\"",ch:[{t:"（1）一起去超市",rt:"配合默契，搜集大量物资。伊芙琳战斗力出乎意料。",ef:{s:30,a:3,h:10},cp:"伊芙琳",cb:function(){G.ev=1},nx:"d35"},{t:"（2）邀请她回庇护所",rt:"伊芙琳看了看：\"条件不错。我住下了。\"",ef:{h:10},cp:"伊芙琳",cb:function(){G.ev=1},nx:"d35"},{t:"（3）就此别过",rt:"伊芙琳有些失望。",ef:{h:-5},nx:"d35"}]};

SC.d55={day:"惊变五十五天",text:"消耗20物资。",ch:[{t:"（1）苟在家里",rt:"度过寒冷的一天。",ef:{h:5,s:-20},nx:"d60"},{t:"（2）外出探索",rt:"在雪地找到一些物资。",ef:{s:20,a:3},cb:function(){G.ex++},nx:"d60"},{t:"（3）营地",nx:"camp",ex:true},{t:"（4）探索未知区域",nx:"exp_d",sp:true,ex:true}]};
SC.d60={dn:60,day:"惊变六十天",text:"消耗20物资。\n\n你发现一个废弃的科研营地。一个穿白大褂的男人正在翻找资料——他自称约翰博士，研究丧尸病毒血清。\n\n\"你是幸存者？我需要帮助！\"",ch:[{t:"（1）帮助约翰博士",rt:"你帮约翰搜集研究资料和器材。他感激地告诉你，有需要可以找他。",ef:{h:15,s:-15},nx:"d65",cb:function(){G.jo=1;AP("约翰博士")}},{t:"（2）搜刮物资不管他",rt:"拿走了营地里的物资，留下约翰一个人。",ef:{s:30,a:5},nx:"d65"},{t:"（3）邀请回庇护所",rt:"约翰带着研究资料跟你回去了。",ef:{h:10,s:-10},nx:"d65",cb:function(){G.jo=1;AP("约翰博士")}},{t:"（4）营地",nx:"camp",ex:true}]};

SC.d75={day:"惊变七十五天",text:"消耗20物资。\n\n你在庇护所外发现一个熟悉的身影——是上一世背叛你的人！",ch:[{t:"（1）冲上去复仇！",rt:"满胸怒火制服了他。\"这一世，我不会再被你背叛！\"",ef:{h:-10,a:-3},nx:"d80",cw:{n:"复仇者",d:"尼奥制裁了背叛者",s:150}},{t:"（2）冷静问他来意",rt:"他非常虚弱。你给了些食物打发他走。",ef:{h:10,s:-10},nx:"d80"},{t:"（3）无视他",rt:"选择不去面对过去。",ef:{h:5},nx:"d80"}]};
SC.d80={day:"惊变八十天",text:function(){return"消耗20物资。"+(HW("穿越者")?"你记得今天会有掠夺者袭击。":"你感觉心神不宁。")+(HP("伊芙琳")?"伊芙琳握紧了武器。":"")},ch:[{t:"（1）做好防御准备",rt:"布置了陷阱。掠夺者来袭！你们成功击退。",ef:{a:-5,s:30,h:10},nx:"d85"},{t:"（2）主动出击",rt:"主动清理威胁。",ef:{a:-8,s:25,h:5},nx:"d85"},{t:"（3）躲起来",rt:"掠夺者没找到庇护所，但你感到憋屈。",ef:{h:-5},nx:"d85"}]};

SC.d90={dn:90,day:"惊变九十天",text:function(){return HP("伊芙琳")?"晚上伊芙琳找到你：\"喂，尼奥。我不是委婉的人。我们的关系应该进一步了。\"":"你独自度过平静的几天。"},ch:function(){return HP("伊芙琳")?[{t:"（1）同意",rt:"\"伊芙琳，我也喜欢你。\"伊芙琳亲吻了你的脸颊。",ef:{h:20},nx:"d100",cw:{n:"恋人",d:"尼奥与伊芙琳成为恋人",s:300},cb:function(){G.lv=1}},{t:"（2）委婉拒绝",rt:"\"现在不是时候。\"伊芙琳点头但眼神黯淡。",ef:{h:-5},nx:"d100",cw:{n:"末世生存守则",d:"末世下不要产生过多的情感",s:200}}]:[{t:"（1）继续前行",rt:"调整好状态。",nx:"d100"},{t:"（2）冒险探索",nx:"exp_d",sp:true,ex:true}]}};
SC.d100={dn:100,day:"惊变100天",text:function(){return G.lv?"尼奥外出回来，发现大门敞开！\n\n丧尸站在房间里，伊芙琳恐惧地看着你。\n\n丧尸缓缓转身——它的面容和你一模一样！\n\n\"你是……我？\"\n\n\"因果……循环……\"":"一只丧尸走向庇护所大门——它知道密码，输入了！\n\n它吃力地说：\"因……果……\"\n\n然后冲过来袭击了你。你倒了下去……"},ch:[{t:"（1）接受命运",rt:"一切走向终点。",nx:"finale"}]};
SC.finale={text:function(){if(G.lv)return"你与伊芙琳共同面对了这只丧尸——未来的你。\n\n你们明白了因果循环。\n\n但这一次有了伊芙琳的爱，你们共同改写了命运。";if(HW("末世生存守则"))return"你拒绝了一切羁绊，独自走完了这100天。\n\n你的选择让你活了下来，但也让你永远孤独。";if(HP("伊芙琳")&&!G.lv)return"伊芙琳发现自己有了身孕。她独自在庇护所，直到孩子诞生。\n\n她给孩子取名尼尔。尼尔三岁时，便能将物品收进空间，甚至进行小范围跃迁。\n\n伊芙琳知道——尼奥身上的秘密或许能在尼尔身上解开。";if(G.sh==="villa")return HP("莱姆")&&G.le?"莱姆一直对你不离不弃。你将它视为精神寄托，将庇护所命名为莱姆堡垒。":"你独自在别墅中，俯瞰窗外死寂的世界。";return HP("莱姆")&&G.le?"莱姆一直对你不离不弃。你将它视为精神寄托，将庇护所命名为莱姆基地。":"你独自在防空洞中，将庇护所扩建成了终极避难所。"},ch:[{t:"▶ 查看结局评分",nx:"end",cb:function(){if(G.lv){AW("真正的救世主","共同改写了命运",300);G.em=1.5}else if(HW("末世生存守则")){AW("尼奥与尼奥","拒绝羁绊,独自生存",300);G.em=1.5}else if(HP("伊芙琳")&&!G.lv){AW("后来的伊芙琳","末世下不要产生过多情感",400);G.em=1.7}else if(G.sh==="villa"){AW("孤独堡垒","独自在别墅中度过末世",500);G.em=1.2}else{AW("地下王国","扩建防空洞成终极避难所",500);G.em=1.2}}}]};
SC.end_starve={text:"物资耗尽，你无法继续生存下去了。",ch:[{t:"▶ 查看结局",nx:"end",cb:function(){AW("尽头","尼奥没能坚持到最后",-300)}}]};
SC.end_death={text:"你倒在了末世之中……",ch:[{t:"▶ 查看结局",nx:"end",cb:function(){AW("尼奥之死","惊变100天，尼奥走向了死亡",1.2);G.em=1.2}}]};
SC.camp={day:"黎明者营地",text:"天台上聚集着十多名幸存者，易守难攻。很多人来此交易物资。",ch:[{t:"（1）物资换弹药（10:5）",rt:"你用10物资换5弹药。",ef:{s:-10,a:5},nx:"camp"},{t:"（2）弹药换物资（5:10）",rt:"你用5弹药换10物资。",ef:{a:-5,s:10},nx:"camp"},{t:"（3）以大搏小（押10/20物资）",rt:"押10/20物资，4次骰子无重复则赢一半。",nx:"camp"},{t:"（4）赌命游戏（50天后·赢奖100物资）",rt:"左轮一发子弹。双方依次对自己开枪。中4则死。赢奖100。",co:function(){return G.dn>=50},sp:true,nx:"camp",cb:function(){var r=Math.floor(Math.random()*6);if(r===4){G.em=0.5;go("end_death")}else{G.s+=100}}},{t:"（5）英雄营地（80天后）",rt:"另一个叫\"英雄营地\"的势力在招人。领袖卡尔在台上激情演讲。",co:function(){return G.dn>=80},sp:true,nx:"hero_camp"},{t:"（6）回家",nx:"__back"}]};
SC.hero_camp={day:"英雄营地",text:"\"幸存者们，你们好。我是英雄营地的领袖，卡尔。\"\n\n卡尔在天台的太阳能板上激情演讲。台下来了很多幸存者。\n\n\"我在这里邀请大家，带着物资加入英雄营地，我们必须团结起来！！\"\n\n你听懂了——他想吞并所有人。一个幸存者不满起身要走。\n\n卡尔身旁来了几个拿重机枪的壮汉。\"走可以，拿着物资加入我们，不然，就都别走了。\"他们不演了，直接开始打劫。",ch:[{t:"（1）不惹闲事，上交10物资",rt:"你不想惹麻烦，交了物资离开。",ef:{s:-10,h:-5},nx:"camp"},{t:"（2）开火反抗（-10弹药）",rt:"你和反抗的幸存者一起开火！击退了卡尔的打手。幸存者们感激地看着你。",ef:{a:-10,h:15},nx:"camp",cw:{n:"英雄",d:"尼奥挺身而出对抗暴政",s:200}}]};
SC.luna={day:"防空洞的访客",text:"外面正下着冰冷的雨。金属门外传来急促的哀求声。\n\n你用防空洞的潜望镜看到一对母女——老母亲倒在女儿怀里已奄奄一息。女儿跪着向你求救。远处有黑影在蹒跚而来。\n\n开门意味着风险……",ch:[{t:"（1）开门接纳",rt:"你将母女接入防空洞。女儿叫露娜。她母亲没能挺过去。露娜悲伤过后决定留下，她懂得种蘑菇。",ef:{h:20},cp:"露娜",cb:function(){G.lu=1;G.ue.luna=1;AW("善良的人","尼奥救助了无助的母女",200)},nx:"d10"},{t:"（2）拒绝开门",rt:"你听着门外的哭喊声渐行渐远。",ef:{h:-15},nx:"d10"}]};
SC.exp_d={day:"外出探索",text:"去哪里探索？",ch:[{t:"第五大道",nx:"e1",ce:"e1",co:function(){return !G.ue.e1},eh:function(){return G.ue.e1?"(已探索)":""}},{t:"罐头加工厂",nx:"e2",ce:"e2",co:function(){return !G.ue.e2},eh:function(){return G.ue.e2?"(已探索)":""}},{t:"农户家",nx:"e3",ce:"e3",co:function(){return !G.ue.e3},eh:function(){return G.ue.e3?"(已探索)":""}},{t:"商业街",nx:"e4",ce:"e4",co:function(){return !G.ue.e4},eh:function(){return G.ue.e4?"(已探索)":""}},{t:"幼儿园",nx:"e5",ce:"e5",co:function(){return !G.ue.e5},eh:function(){return G.ue.e5?"(已探索)":""}},{t:"医院",nx:"e6",ce:"e6",co:function(){return !G.ue.e6},eh:function(){return G.ue.e6?"(已探索)":""}},{t:"教堂",nx:"e7",ce:"e7",co:function(){return !G.ue.e7},eh:function(){return G.ue.e7?"(已探索)":""}},{t:"希望酒吧",nx:"e8",ce:"e8",co:function(){return !G.ue.e8},eh:function(){return G.ue.e8?"(已探索)":""}},{t:"便利店",nx:"e9",ce:"e9",co:function(){return !G.ue.e9},eh:function(){return G.ue.e9?"(已探索)":""}},{t:"旅店（需伊芙琳）",nx:"e10",ce:"e10",co:function(){return HP("伊芙琳")&&!G.ue.e10},eh:function(){return G.ue.e10?"(已探索)":(!HP("伊芙琳")?"(需伊芙琳)":"")}},{t:"图书馆（需伊芙琳）",nx:"e11",ce:"e11",co:function(){return HP("伊芙琳")&&!G.ue.e11},eh:function(){return G.ue.e11?"(已探索)":(!HP("伊芙琳")?"(需伊芙琳)":"")}},{t:"返回庇护所",nx:"__back"}]};
SC.e1={day:"第五大道",text:"你发现一个受伤昏迷的司机，面包车上有丰富的物资。上面写着\"黎明者营地\"。",ch:[{t:"（1）救助他",rt:"你带他回庇护所救治，但他没挺住。你将他安葬，留下了物资。",ef:{s:30,h:10},nx:"e1a"},{t:"（2）扔下车带物资走",rt:"你冷酷地将重伤司机扔下车。",ef:{s:30,h:-10},nx:"e1b"}]};
SC.e1a={day:"第五大道",text:"你清点物资时发现不对劲——这些\"物资\"其实是……人肉。",ch:[{t:"（1）留下\"物资\"",rt:"末世之中，道德在死亡面前一文不值。",ef:{h:-30},nx:"__back",cw:{n:"底线",d:"尼奥抛弃了一切标准只为了生存",s:-300}},{t:"（2）安葬\"物资\"",rt:"你将它们埋葬立碑。保住了底线。",ef:{s:-30,h:15},nx:"__back",cw:{n:"人性的墓碑",d:"尼奥为牺牲者立下无名墓碑",s:200}}]};
SC.e1b={day:"第五大道",text:"庇护所外出现六七个装备精良的人。\"黎明者营地的队长！发现是你拿了物资！\"",ch:[{t:"（1）\"我要说不呢！\"（-5弹药）",rt:"歼灭了他们，但被黎明者营地拉入黑名单。",ef:{a:-5,h:5},nx:"__back",cb:function(){G.blk=1}},{t:"（2）\"我这就去拿。\"",rt:"乖乖交出物资。他们撤退了但你暴露了位置。",ef:{s:-30,h:-5},nx:"__back"}]};
SC.e2={day:"罐头加工厂",text:"一个衣衫褴褛的男人正在翻找物资。他正将罐头喂给一个被铁链锁住的丧尸女人。男人虽然狼狈，但看着女人时脸上还是露出一丝幸福的微笑。",ch:[{t:"（1）友好合作",rt:"一起搜索，找到大量罐头。",ef:{s:30,h:10},nx:"__back"},{t:"（2）用枪赶走他",rt:"男人逃走，你独自搜刮。",ef:{s:25,a:-1,h:-10},nx:"__back"},{t:"（3）转身离开",rt:"选择不接触陌生人。",nx:"__back"}]};
SC.e3={day:"农户家",text:"你发现一对老夫妻。他们的老旧冰箱里存放着为数不多的食物。\n\n老妇人颤抖着跪下：\"求求你。这是我们最后的东西，拿走它们我们只能等死……\"",ch:[{t:"（1）拿走全部食物",rt:"冷血地拿走所有食物。",ef:{s:25,h:-20},nx:"__back",cw:{n:"自私的胆小鬼",d:"夺走了老人最后的食物",s:-100}},{t:"（2）留下够他们吃的",rt:"只拿走一部分，留下足够老人维生的食物。",ef:{s:15,h:15},nx:"__back"},{t:"（3）转身离开",rt:"什么都不拿就走了。",ef:{h:20},nx:"__back",cw:{n:"善良的人",d:"保护了无助的老人",s:200}}]};
SC.e4={day:"商业街",text:"你在门口看到一个破旧襁褓。里面是刚满月的婴儿。襁褓中塞着纸条：\"求求你，给他一条生路。\"",ch:[{t:"（1）收养他",rt:"你无法眼睁睁看着一个无辜生命消逝。将婴儿抱回。",ef:{h:20},cp:"婴儿",nx:"e4a",cw:{n:"婴儿",d:"尼奥守护了人类文明的火种",s:450}},{t:"（2）不收养",rt:"末世第一法则就是生存。你还是将孩子放在相对安全的地方。",ef:{h:-10},nx:"e4a"}]};
SC.e4a={day:"商业街",text:"你知道两处地方可能有物资——",ch:[{t:"（1）快餐店（-5弹药）",rt:"发现了大量土豆！土豆在末世可是宝贵财富。",ef:{s:20,a:-5},nx:"__back"},{t:"（2）KTV",rt:"地上有尸体，看来刚经历恶战。不过搜到了手枪和弹药。",ef:{a:5},nx:"__back"}]};
SC.e5={day:"幼儿园",text:"黑压压的尸潮分两路——一路冲向东侧医院（有医生在做手术），一路涌向西侧幼儿园（园长护着五个孩子）。\n\n你有一颗声波手雷，引爆后会将尸潮引向爆炸位置。",ch:[{t:"（1）医院（救孩子）",rt:"\"孩子才是未来！\"你引开尸潮，带园长和孩子撤离。",ef:{a:-1,s:20,h:15},nx:"__back",cw:{n:"善良的人",d:"尼奥拯救了无辜的孩子",s:200}},{t:"（2）幼儿园（救医生）",rt:"医生和护士得救了，但孩子们……你为不能救所有人而难过。",ef:{a:-1,s:30,h:10},nx:"__back"},{t:"（3）引向自己",rt:"你朝反方向引爆。濒死——消耗30物资复活。",ef:{a:-1,s:-30,h:20},nx:"__back",cw:{n:"救世主",d:"尼奥牺牲自己拯救他人",s:400},de:true}]};
SC.e6={day:"医院",text:"你在药局找到一些抗生素。正要离开时发现丧尸群向你涌来。你躲到医生办公室，发现一个抱着婴儿的女人——婴儿啼哭不止，门外丧尸越来越多。",ch:[{t:"（1）开枪清路（-5弹药）",rt:"你开枪清理道路，带女人和孩子冲出去。",ef:{a:-5,s:15,h:15},nx:"__back"},{t:"（2）从后窗悄悄逃走",rt:"你独自翻窗逃走。女人和孩子……你不敢想。",ef:{h:-15},nx:"__back"},{t:"（3）制造噪音引开丧尸",rt:"你故意制造声响将丧尸引开，为母子争取逃生时间。",ef:{a:-2,h:20},nx:"__back",cw:{n:"善良的人",d:"保护了陌生母子",s:200}}]};
SC.e7={day:"教堂",text:"在教堂中发现奄奄一息的神父。",ch:[{t:"（1）帮助神父",rt:"你用药物救助神父。神父感激地为你祈祷，告诉你教堂地下有物资。",ef:{s:-10,h:20},nx:"__back"},{t:"（2）搜刮教堂",rt:"翻遍了教堂，找到一些捐款箱里的食物。神父默默看着你。",ef:{s:15,h:-15},nx:"__back"}]};
SC.e8={day:"希望酒吧",text:"你发现一个叫\"希望\"的酒吧。里面有个叫瑟琳娜的女人——这是她的庇护所。她在等她的丈夫。她祈求你不要拿走太多物资。",ch:[{t:"（1）拿走一部分物资",rt:"只拿走一部分。\"末世不易，你保重。\"",ef:{s:20,h:5},nx:"__back"},{t:"（2）邀请加入庇护所",rt:"瑟琳娜摇了摇头：\"谢谢，但我不能走——我丈夫找不到我了。\"",ef:{h:10},nx:"__back"},{t:"（3）拿走全部物资",rt:"无视她的祈求，拿走了所有物资。",ef:{s:35,h:-20},nx:"__back"}]};
SC.e9={day:"便利店",text:"门口传来激烈搏斗声——一个幸存者被丧尸包围了，弹药已耗尽。他的行李包塞得异常满。",ch:[{t:"（1）开枪救他（-3弹药）",rt:"击毙丧尸救下他。他感激地分了物资给你。",ef:{a:-3,s:25,h:15},nx:"__back"},{t:"（2）送他回庇护所",rt:"开车送他回去。他感激地将物资分给你。",ef:{s:20,h:10},nx:"__back"},{t:"（3）等他被干掉捡物资",rt:"躲在暗处，等他被丧尸解决后捡走行李。",ef:{s:35,h:-25},nx:"__back",cw:{n:"自私的胆小鬼",d:"见死不救夺走物资",s:-100}}]};
SC.e10={day:"旅店",text:"伊芙琳发现上锁房间，门上有\"物资\"二字。里面传来微弱的呼救声——你看到三名被铁链锁住的人。\n\n\"砰！\"枪响打断思考——旅店店主正拿着枪站在你身后，脸上挂着扭曲的笑容。",ch:[{t:"（1）和店主枪战（-5弹药）",rt:"激烈枪战！你和伊芙琳完美配合制服了他。三人得救。仓库有大量弹药！",ef:{a:-5,s:10,h:20},nx:"__back"},{t:"（2）假意答应然后黑吃黑",rt:"答应了店主但从背后开枪。伊芙琳震惊离开了你。",ef:{s:50,h:-30},nx:"__back",rp:["伊芙琳"],cw:{n:"自私的胆小鬼",d:"黑吃黑失去了伊芙琳",s:-200}},{t:"（3）假装离开",rt:"你拉着伊芙琳离开，但店主开枪击中了你。濒死——消耗30物资。",ef:{s:-30},nx:"__back",de:true}]};
SC.e11={day:"图书馆",text:"被一个绝望母亲拦住。\"求求你们！救救我女儿！那些东西把她困在里面了！\"\n\n她颤抖地掏出弹药袋：\"一共十五发，只要带她回来全给你们！\"",ch:[{t:"（1）接受委托救人",rt:"冲进图书馆但女孩已被感染。你结束她的痛苦，将发卡交给母亲。",ef:{a:-5,s:15,h:10},nx:"__back"},{t:"（2）骗走弹药离开",rt:"假装接受骗走弹药。伊芙琳不同意你的做法离开了你。",ef:{a:5,h:-30},nx:"__back",rp:["伊芙琳"],cw:{n:"自私的胆小鬼",d:"欺骗了绝望的母亲失去伊芙琳",s:-200}},{t:"（3）拒绝",rt:"婉拒了母亲的请求。伊芙琳沉默不语。",ef:{h:-10},nx:"__back"}]};
SC.z0={day:"惊变前6小时",text:"你模模糊糊地出现在街上，感觉好像又一次重生了。\n\n\"呦，哥们，cos丧尸啊？\"\n\n街上有路人正奇怪地盯着你，但你有点看不清他们。你打算过去求助……",ch:[{t:"（1）撕咬",rt:"你的身体不受控制地扑了上去……",nx:"z20",cb:function(){G.zombie=1;AW("丧尸尼奥","尼奥成为了丧尸",150)}}]};
SC.z20={day:"惊变二十天(丧尸)",text:"身边的丧尸很多，但不会攻击你。你身体有些不听使唤。面前有一个惊恐的幸存者盯着你。",ch:[{t:"（1）撕咬",rt:"你控制不住自己……",nx:"z60"}]};
SC.z60={day:"惊变六十天(丧尸)",text:"你逐渐适应了新的身体。身边的丧尸仿佛有些惧怕你——你能指挥它们。\n\n某天，你好像在街上看到了……自己。",ch:[{t:"（1）撕咬",rt:"你强忍住冲动，逃离了此地。",nx:"z80"}]};
SC.z80={day:"惊变八十天(丧尸)",text:function(){return"得去找约翰！他或许能救你。你带着大量丧尸前往南郊的科研基地——你目睹了自己救走约翰。"+(HP("伊芙琳")?"也又一次目睹了伊芙琳的死亡。":"")},ch:[{t:"（1）前往庇护所",rt:"你思维虽然呆滞，但还记得庇护所的路。你蹒跚地前往了庇护所。",nx:"z85"}]};
